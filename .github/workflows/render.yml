name: Render slides

on:
  push:
    paths:
      - 'slides/**'
      - 'render.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright==1.47.0
      - run: python -m playwright install --with-deps chromium
      - run: python render.py
      - name: Commit rendered slides
        run: |
          git config user.name 'dynasty-ticker-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add out
          git diff --cached --quiet || (git commit -m 'Render slides' && git push)
