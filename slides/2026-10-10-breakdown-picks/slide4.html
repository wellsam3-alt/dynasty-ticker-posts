<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,400..900;1,62..125,400..900&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</head>
<body>
<div style="width: 1080px; height: 1440px; box-sizing: border-box; position: relative; overflow: hidden; background: #F5D547; color: #0B1A2E; font-family: 'Archivo', sans-serif; padding: 72px 64px 48px; display: flex; flex-direction: column">
  <div style="position: relative; display: flex; justify-content: space-between; font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 600">
    <span style="letter-spacing: 0.08em">THE TAKEAWAY</span><span>DYNASTY TICKER</span>
  </div>

  <div style="position: relative; margin-top: 120px; font-family: 'IBM Plex Mono', monospace; font-size: 30px; font-weight: 600; letter-spacing: 0.1em">DYNASTY TICKER'S CALL</div>
  <div style="position: relative; margin-top: 18px; font-weight: 900; font-stretch: 110%; font-size: 132px; line-height: 0.88; letter-spacing: -0.03em">So what<br>do I do?</div>

  <div style="position: relative; margin-top: 64px; display: flex; flex-direction: column; gap: 24px">
    <div style="background: #0B1A2E; color: #F2F5F9; border-radius: 16px; padding: 38px 40px; display: flex; flex-direction: column; gap: 16px">
      <div style="display: flex; justify-content: space-between; align-items: center; font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 600; letter-spacing: 0.1em">
        <span style="color: #F5D547">IF YOU'RE CONTENDING</span><span style="background: #FF8A3D; color: #0B1A2E; padding: 8px 16px; border-radius: 8px">SELL ▼</span>
      </div>
      <span style="font-weight: 800; font-size: 50px; line-height: 1.15">Sell your picks for value that can help you <span style="color: #F5D547">WIN NOW.</span></span>
    </div>
    <div style="background: #0B1A2E; color: #F2F5F9; border-radius: 16px; padding: 38px 40px; display: flex; flex-direction: column; gap: 16px">
      <div style="display: flex; justify-content: space-between; align-items: center; font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 600; letter-spacing: 0.1em">
        <span style="color: #F5D547">IF YOU'RE REBUILDING</span><span style="background: #2BD47D; color: #0B1A2E; padding: 8px 16px; border-radius: 8px">BUY ▲</span>
      </div>
      <span style="font-weight: 800; font-size: 50px; line-height: 1.15">Now is the time to <span style="color: #F5D547">buy.</span></span>
    </div>
  </div>

  <div style="position: relative; margin-top: auto; border-top: 3px solid #0B1A2E; padding-top: 24px; display: flex; justify-content: space-between; font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 600">
    <span>@dynasty_ticker</span><span>4 / 5</span>
  </div>
</div>
</body>
</html>
