<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,400..900;1,62..125,400..900&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</head>
<body>
<div style="width: 1080px; height: 1440px; box-sizing: border-box; position: relative; overflow: hidden; background: #0B1A2E; color: #F2F5F9; font-family: 'Archivo', sans-serif; padding: 72px 64px 48px; display: flex; flex-direction: column">
  <div style="position: absolute; inset: 0; background: repeating-linear-gradient(0deg, transparent 0 63px, rgba(245,213,71,0.06) 63px 64px)"></div>

  <div style="position: relative; display: flex; justify-content: space-between; align-items: center; font-family: 'IBM Plex Mono', monospace; font-size: 24px; font-weight: 600">
    <span style="background: #F5D547; color: #0B1A2E; padding: 10px 16px; border-radius: 6px; letter-spacing: 0.08em">THE BREAKDOWN · LESSON 01</span>
    <span style="color: #8FA3BC">DYNASTY TICKER</span>
  </div>

  <div style="position: relative; margin-top: 120px; font-family: 'IBM Plex Mono', monospace; font-size: 28px; color: #F5D547; letter-spacing: 0.1em">ROOKIE PICKS, EXPLAINED LIKE A STOCK</div>
  <div style="position: relative; margin-top: 18px; font-weight: 900; font-stretch: 110%; font-size: 140px; line-height: 0.88; letter-spacing: -0.03em">Your picks<br>are<br><span style="color: #F5D547">mispriced.</span></div>
  <div style="position: relative; margin-top: 40px; font-size: 40px; line-height: 1.3; color: #C9D4E2; max-width: 820px">Right now, every future 1st trades like it's the same pick. It isn't.</div>

  <div style="position: relative; margin-top: auto; display: flex; align-items: center; gap: 28px">
    <div style="position: relative; width: 300px; height: 150px; background: #F5D547; color: #0B1A2E; border-radius: 12px 70px 70px 12px; transform: rotate(-8deg); display: flex; align-items: center; padding-left: 34px; box-sizing: border-box">
      <span style="position: absolute; right: 34px; top: 61px; width: 28px; height: 28px; border-radius: 50%; background: #0B1A2E"></span>
      <div style="font-family: 'IBM Plex Mono', monospace; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 22px; font-weight: 600">PRICED AS</span>
        <span style="font-size: 46px; font-weight: 600">MID 1ST</span>
      </div>
    </div>
    <div style="font-family: 'IBM Plex Mono', monospace; font-size: 24px; color: #8FA3BC; line-height: 1.5">A future pick is a call option.<br>Swipe for the lesson →</div>
  </div>

  <div style="position: relative; margin-top: 40px; border-top: 2px solid #1E3352; padding-top: 24px; display: flex; justify-content: space-between; font-family: 'IBM Plex Mono', monospace; font-size: 24px; color: #8FA3BC">
    <span>@dynasty_ticker</span><span>1 / 5</span>
  </div>
</div>
</body>
</html>
